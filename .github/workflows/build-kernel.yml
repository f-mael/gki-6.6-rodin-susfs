name: Build GKI 6.6 KernelSU-Next SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /etc/mysql /var/lib/mysql /usr/local/lib/android
          sudo apt-get clean
          df -h

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev libssl-dev libxml2-utils

      - name: Install Repo Tool
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" > $GITHUB_PATH

      - name: Sync GKI Source
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          mkdir -p android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android15-6.6 --depth=1
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: Integrate KernelSU-Next & SUSFS
        run: |
          cd android-kernel
          
          # Clonar SUSFS
          git clone https://gitlab.com/simonpunk/susfs4ksu -b gki-android15-6.6 susfs
          
          # Integrar KernelSU-Next usando la rama dev-susfs (trae soporte nativo para SUSFS)
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
          
          # Copiar archivos e includes de SUSFS al kernel
          cp -r susfs/kernel_patches/fs/* ./common/fs/
          cp -r susfs/kernel_patches/include/linux/* ./common/include/linux/
          
          # Aplicar únicamente el parche del kernel GKI
          cd common
          patch -p1 < ../susfs/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch
          
          # Habilitar opciones en defconfig
          echo "CONFIG_KSU=y" > arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS=y" > arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" > arch/arm64/configs/gki_defconfig

      - name: Build Kernel
        run: |
          cd android-kernel
          tools/bazel run --config=fast //common:kernel_aarch64_dist

      - name: Prepare AnyKernel3 (64-bit)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 -b master AK3
          git clone https://github.com/osm0sis/AnyKernel3 -b arm64-tools AK3_tools
          cp -f AK3_tools/* AK3/tools/
          rm -rf AK3_tools
          
          sed -i 's/is_slot_device=0;/is_slot_device=1;/' AK3/anykernel.sh
          cp android-kernel/out/kernel_aarch64/dist/Image AK3/
          
          cd AK3
          zip -r9 ../AnyKernel3-KernelSU-Next-SUSFS-GKI-6.6.zip * -x .git README.md *placeholder

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-KernelSU-Next-SUSFS-GKI-6.6
          path: AnyKernel3-KernelSU-Next-SUSFS-GKI-6.6.zip
